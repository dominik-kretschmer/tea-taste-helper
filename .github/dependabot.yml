version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Prisma-Pakete müssen dieselbe Version haben
      prisma:
        patterns: ['prisma', '@prisma/*']
    ignore:
      # Typen müssen zur Node-Version passen (Node 22, siehe CI und README)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 hat keine Compiler-JS-API mehr; vue-tsc (nuxt typecheck) und typescript-eslint brauchen sie
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
